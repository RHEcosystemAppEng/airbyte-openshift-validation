# RayJob that runs the EDGAR RAG ingestion pipeline
#
# Do NOT include in kustomization.yaml — apply separately after:
#   1. edgar-seed-s3 and milvus-s3-config Secrets exist
#   2. Seed corpus uploaded to s3://$S3_BUCKET/$S3_PREFIX/
#   3. RayCluster "edgar-rag" is running on the custom image
#   4. Milvus is ready: oc wait --for=condition=ready pod -l app=milvus --timeout=180s
#
# Apply:
#   oc apply -f manifests/rag-pipeline/rayjob-edgar-pipeline.yaml
#
# Actor counts are sized for the validation cluster (2 workers × 2 CPU = 4 CPUs).
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: edgar-rag-ingest
  namespace: airbyte-validation
  labels:
    app.kubernetes.io/part-of: edgar-rag-pipeline
    app.kubernetes.io/component: job
spec:
  submissionMode: K8sJobMode
  clusterSelector:
    ray.io/cluster: edgar-rag

  # Submitter uses the same image (pipeline code is baked in). No PVC.
  submitterPodTemplate:
    metadata:
      labels:
        app: edgar-rag-submitter
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ray-job-submitter
          # Replace with your immutable image tag or digest before apply.
          image: quay.io/EXAMPLE/edgar-rag-ray:0.1.0
          env:
            - name: INPUT_SOURCE
              value: s3
            - name: PYTHONPATH
              value: /opt/edgar-rag
          envFrom:
            - secretRef:
                name: edgar-seed-s3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      restartPolicy: Never

  # Deps and code come from the image; runtimeEnv only sets job env vars.
  runtimeEnvYAML: |
    env_vars:
      INPUT_SOURCE: s3
      PYTHONPATH: /opt/edgar-rag
      MILVUS_HOST: milvus-milvus.airbyte-validation.svc.cluster.local
      MILVUS_PORT: "19530"
      MILVUS_COLLECTION: edgar_filings
      DROP_EXISTING_COLLECTION: "true"
      PROCESS_LEGAL: "true"
      PROCESS_COMPLIANCE: "true"
      PROCESS_FACTSHEETS: "true"
      NUM_DOCLING_ACTORS: "2"
      CPUS_PER_DOCLING_ACTOR: "1"
      NUM_EMBED_ACTORS: "1"
      NUM_MILVUS_ACTORS: "1"
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIM: "384"

  entrypoint: python -m pipeline.edgar_rag_pipeline

  shutdownAfterJobFinishes: false
  ttlSecondsAfterFinished: 3600

  activeDeadlineSeconds: 7200
