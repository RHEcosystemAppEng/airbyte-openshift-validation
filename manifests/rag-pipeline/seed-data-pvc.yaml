# PVC for the SEC EDGAR seed corpus + pipeline code
#
# Uses ReadWriteMany so the Ray head and workers (potentially on different
# nodes) can all mount it. Requires a storage class that supports RWX
# (e.g. ODF/CephFS, NFS, or EFS on ROSA).
#
# Upload workflow:
#   oc run seed-loader --image=registry.access.redhat.com/ubi9/ubi-minimal \
#     --restart=Never --overrides='{"spec":{"containers":[{"name":"loader",
#     "image":"registry.access.redhat.com/ubi9/ubi-minimal","command":["sleep","3600"],
#     "volumeMounts":[{"name":"data","mountPath":"/data"}]}],
#     "volumes":[{"name":"data","persistentVolumeClaim":{"claimName":"seed-data"}}]}}'
#   oc rsync data/seed/ seed-loader:/data/seed/
#   oc rsync pipeline/ seed-loader:/data/pipeline/
#   oc delete pod seed-loader
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seed-data
  labels:
    app.kubernetes.io/part-of: edgar-rag-pipeline
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
